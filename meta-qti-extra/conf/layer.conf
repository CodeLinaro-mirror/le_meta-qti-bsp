# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-extra"
BBFILE_PATTERN_qti-extra = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-extra = "12"

LAYERSERIES_COMPAT_qti-extra = "dunfell  gatesgarth hardknott kirkstone"

