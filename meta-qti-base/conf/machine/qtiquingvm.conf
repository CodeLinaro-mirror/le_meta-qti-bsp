#@TYPE: Machine
#@NAME: qtiquingvm
#@DESCRIPTION: Machine configuration for QTI QUIN

BASEMACHINE ?= "qtiquingvm"
include conf/machine/include/auto-common.inc
include conf/machine/include/bbmask.inc

SERIAL_CONSOLE = "115200 ttyAMA0"

# EMMC TARGET TO SUPPORT 64-bit kernel
DEFAULTTUNE = "aarch64"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 ?= "100000000"
SYSTEMRW_SIZE_EXT4 ?= "8388608"
USERDATA_SIZE_EXT4 ?= "2000000000"
CACHE_SIZE_EXT4 ?= "80000000"

# Rootfs size
IMAGE_ROOTFS_SIZE = "1048576"

# Formats of root filesystem images.
IMAGE_FSTYPES += "ext4"
RECOVERY_IMAGE = "0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "vendor/qti-quin-gvm-perf_defconfig"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image-dtb"

IMAGE_EXT4_EXTRA_OPTIONS = "${@bb.utils.contains('DISTRO_FEATURES','ro-rootfs',' -J -b 1024 ','',d)}"

IMAGE_FEATURES_append = " read-only-rootfs"

KERNEL_CMD_PARAMS_append = " console=ttyAMA0 loglevel=8 user_debug=31 print-fatal-signals=1 no_console_suspend firmware_class.path=/firmware/image/ fsck.repair=yes ip=192.168.1.2::192.168.1.10:255.255.255.0::eth0:none swiotlb=5120 kpti=1 "

MACHINE_FEATURES += "\
    qti-audio \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-dual-wlan \
    qti-extra \
    qti-graphics \
    qti-hypervisor \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-wlan \
"
