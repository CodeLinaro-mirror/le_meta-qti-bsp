#@TYPE: Machine
#@NAME: qtiquingvm
#@DESCRIPTION: Machine configuration for QTI QUIN

BASEMACHINE ?= "qtiquingvm"
include conf/machine/include/auto-common.inc
include conf/machine/include/bbmask.inc

SERIAL_CONSOLE = "115200 ttyAMA0"

# EMMC TARGET TO SUPPORT 64-bit kernel
DEFAULTTUNE = "aarch64"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 ?= "100000000"
SYSTEMRW_SIZE_EXT4 ?= "8388608"
USERDATA_SIZE_EXT4 ?= "2000000000"
CACHE_SIZE_EXT4 ?= "80000000"

# Rootfs size
IMAGE_ROOTFS_SIZE = "1048576"

# Formats of root filesystem images.
IMAGE_FSTYPES += "ext4"
RECOVERY_IMAGE = "0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/quinvm-qgki_defconfig', 'vendor/quinvm-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

IMAGE_EXT4_EXTRA_OPTIONS = "${@bb.utils.contains('DISTRO_FEATURES','ro-rootfs',' -J -b 1024 ','',d)}"

IMAGE_FEATURES_append = " read-only-rootfs"


MACHINE_FEATURES += "\
    qti-audio \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-dual-wlan \
    qti-extra \
    qti-graphics \
    qti-hypervisor \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-wlan \
"
BBMASK .= "|meta-qti-bsp-prop/meta-qti-base-prop/recipes-multimedia/vpp-noship/vpp-noship_git.bb"
BBMASK .= "|meta-qti-bsp-prop/meta-qti-base-prop/recipes-multimedia/vpp/vpp_git.bb"
BBMASK .= "|meta-qti-bsp-prop/meta-qti-base-prop/recipes-core/qmi-framework/qmi-framework_git.bb"
BBMASK .= "|meta-qti-bsp-prop/meta-qti-base-prop/recipes-core/diag/diag_git.bb"
BBMASK .= "|meta-qti-bsp-prop/meta-qti-base-prop/recipes-audio/audioalsa/audioalsa_git.bb"
