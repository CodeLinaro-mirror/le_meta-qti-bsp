#@TYPE: Machine
#@NAME: sa81x5
#@DESCRIPTION: Machine configuration for QTI sa81x5

BASEMACHINE = "sa81x5"
include conf/machine/include/auto-common.inc

#sa81x5 board chip belongs to cortexa76-cortexa55
include conf/machine/include/tune-cortexa76-cortexa55.inc

RECOVERY_IMAGE = "0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/gen3auto-qgki_defconfig', 'vendor/gen3auto-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xa90000 androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 androidboot.selinux=permissive buildvariant=userdebug rootfstype=ext4 rw rootwait firmware_class.path=/firmware/image/ resume=/dev/sda8 hibernate=nocompress noswap_randomize pcie_ports=compat systemd.gpt_auto=0 "
KERNEL_CMD_PARAMS_append = " fsck.repair=yes "
KERNEL_CMD_PARAMS_append = "${@bb.utils.contains_any('VARIANT', 'perf user', 'no_hotplug_area=0x80000000,0x60000000 dyn_memhotplug ', '', d)}"
KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'early_init', 'early_userspace ', '', d)}"
KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200n8', '', d)}"
KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=msm_geni_serial,0xa90000', '', d)}"
KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'lxc', ' androidboot.android_dt_dir=/skip/ ', '', d)}"
KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'lxc', 'androidboot.console=tty30', '', d)}"
KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains('DISTRO_FEATURES', 'early_init', 'rootwait ', '', d)}"
KERNEL_IMAGETYPE = "Image"

IMAGE_FEATURES_append = " read-only-rootfs"

MACHINE_FEATURES += "\ 
    qti-audio \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-location \
    qti-ml \
    qti-multimedia \
    qti-qdrive \
    qti-ros \
    qti-security \
    qti-tools \
    qti-vnw \
    qti-wlan \
"

MACHINE_FEATURES += "dt-overlay"
MACHINE_FEATURES += "goldcore-boot"
