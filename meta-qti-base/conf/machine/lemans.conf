#@TYPE: Machine
#@NAME: LeMans
#@DESCRIPTION: Machine configuration for QTI LeMans

BASEMACHINE = "lemans"
include conf/machine/include/auto-common.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc
TUNE_CCARGS:append = " -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57"

RECOVERY_IMAGE = "0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/lemans_auto-qgki_defconfig', 'vendor/lemans_auto-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xa8c000 no_console_suspend=1 rw rootwait rootfstype=ext4 firmware_class.path=/firmware/image/ nokaslr"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=msm_geni_serial,0xa8c000', '', d)}"
KERNEL_IMAGETYPE = "Image"

# bootloader configuration
EXTRA_IMAGEDEPENDS += "edk2"

IMAGE_FEATURES:append = " read-only-rootfs"

MACHINE_FEATURES += "\
    qti-core \
    qti-extra \
    qti-tools \
    qti-multimedia \
    qti-camera\
    qti-display \
"
MACHINE_FEATURES += "dt-overlay"

MACHINE_EXTRA_RDEPENDS += "vpu-firmware"
