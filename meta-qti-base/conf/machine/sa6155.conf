#@TYPE: Machine
#@NAME: sa6155
#@DESCRIPTION: Machine configuration for QTI sa6155

BASEMACHINE = "sa6155"
include conf/machine/include/auto-common.inc

#sa6155 board chip belongs to cortexa76-cortexa55
include conf/machine/include/tune-cortexa76-cortexa55.inc

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/sdmsteppeauto-qgki_defconfig', 'vendor/sdmsteppeauto-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = "console=ttyMSM0,115200n8 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 service_locator.enable=1 rootfstype=ext4 rw firmware_class.path=/firmware/image/ pcie_ports=compat "
KERNEL_CMD_PARAMS:append = " fsck.repair=yes "
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains_any('VARIANT', 'perf user', ' no_hotplug_area=0x80000000,0x60000000 dyn_memhotplug ', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('DISTRO_FEATURES', 'early_init', ' early_userspace ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=msm_geni_serial,0x880000', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'androidboot.console=ttyMSM0', '', d)}"
# Workaround for current serial driver
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('VARIANT', 'debug', ' quiet systemd.log_target=null ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('COMBINED_FEATURES', 'qti-lxc', ' androidboot.android_dt_dir=/skip/ ', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('COMBINED_FEATURES', 'qti-lxc', ' androidboot.console=tty30 ', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('COMBINED_FEATURES', 'qti-lxc', ' androidboot.selinux=permissive ', '', d)}"
KERNEL_IMAGETYPE = "Image"

# bootloader configuration
EXTRA_IMAGEDEPENDS += "edk2"

MACHINE_FEATURES += "\
    qti-audio \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-tools \
    qti-vnw \
    qti-wlan \
    qti-location \
"

MACHINE_FEATURES += "dt-overlay"
MACHINE_FEATURES += "goldcore-boot"
