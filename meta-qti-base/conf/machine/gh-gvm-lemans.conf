#@TYPE: Machine
#@NAME: gh-gvm-lemans
#@DESCRIPTION: Machine configuration for QTI SH GVM LEMANS(GEN4) Platform

BASEMACHINE ?= "gh-gvm-lemans"
include conf/machine/include/auto-common.inc

# Gen4(sa8295) board chip belongs to Cortex-A78C-Cortex-X1C
# GCC and Clang do not support Cortex-A78C-Cortex-X1C configurations yet.
# The highest configuration currently supported is Cortex-A78C(kirkstone)
include conf/machine/include/tune-cortexa78c.inc
# Tobe confirm machine inc
# DEFAULTTUNE = "aarch64"
# include conf/machine/include/arm/arch-armv8a.inc
# TUNE_CCARGS:append = " -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57"

PREFERRED_PROVIDER_dtc-native = "dtc-aosp-native"

PREFERRED_VERSION_linux-msm = "6.1"
PREFERRED_VERSION_adsprpc = "2.0"
PREFERRED_VERSION_media-codec2 = "auto.1.0"
PREFERRED_VERSION_media-external = "auto.1.0"
PREFERRED_VERSION_media-noship = "auto.1.0"

# lemans gvm prefer camx
PREFERRED_VERSION_cameradlkm = "0.2"

KERNEL_ARCH = "autoghgvm"
KERNEL_VARIANT = "${@bb.utils.contains_any('VARIANT', 'perf user', 'perf_', 'debug_', d)}"
KERNEL_BUILD_CONFIG = "msm-kernel/build.config.msm.${KERNEL_ARCH}.lxc"
KERNEL_IMAGE_HEADER_VERSION = "2"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/autoghgvm_defconfig', 'vendor/autoghgvm-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

#qti-display qti-audio-ar qti-multimedia qti-camera
MACHINE_FEATURES += "\
    qti-security \
    qti-core \
    qti-hypervisor \
    qti-ghgvm \
    qti-dlkm \
"

SECTOOLS_SECURITY_PROFILE = "lemans_tz_security_profile.xml"
