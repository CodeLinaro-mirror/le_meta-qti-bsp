#@TYPE: Machine
#@NAME: quin-gvm-gen4
#@DESCRIPTION: Machine configuration for QTI QUIN

BASEMACHINE ?= "quin-gvm-gen4"
include conf/machine/include/auto-common.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc
TUNE_CCARGS:append = " -march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57"

SERIAL_CONSOLE = "115200 ttyAMA0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/autogvm-qgki_defconfig', 'vendor/autogvm-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

MACHINE_FEATURES += "\
    qti-audio \
    qti-audio-ar \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-dual-wlan \
    qti-extra \
    qti-graphics \
    qti-hypervisor \
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-wlan \
    qti-tools \
    qti-dual-cdsp \
"
