#@TYPE: Machine
#@NAME: quin-gvm-gen4
#@DESCRIPTION: Machine configuration for QTI QUIN

BASEMACHINE ?= "quin-gvm-gen4"
include conf/machine/include/auto-common.inc

#sa8295 board chip belongs to Cortex-A78C-Cortex-X1C
#GCC and Clang do not support Cortex-A78C-Cortex-X1C configurations yet.The highest configuration currently supported is cortex-A76(yocto.3.1) and Cortex-A78C(yocto.4.0).
include ${@bb.utils.contains('LAYERSERIES_COMPAT_yocto', 'dunfell', 'conf/machine/include/tune-cortexa76.inc', 'conf/machine/include/tune-cortexa78c.inc', d)}

SERIAL_CONSOLE = "115200 ttyAMA0"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/autogvm-qgki_defconfig', 'vendor/autogvm-qgki-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

MACHINE_FEATURES += "\
    ${@bb.utils.contains('LAYERSERIES_COMPAT_yocto', 'kirkstone', '', 'qti-audio', d)} \
    ${@bb.utils.contains('LAYERSERIES_COMPAT_yocto', 'kirkstone', '', 'qti-audio-ar', d)} \
    qti-bluetooth \
    qti-camera \
    qti-core \
    qti-data \
    qti-display \
    qti-dual-wlan \
    qti-extra \
    qti-graphics \
    qti-hypervisor \
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-wlan \
    qti-tools \
    qti-dual-cdsp \
"
