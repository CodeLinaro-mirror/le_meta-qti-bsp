#@TYPE: Machine
#@NAME: qtiquingvm8295
#@DESCRIPTION: Machine configuration for QTI Quin

BASEMACHINE ?= "qtiquingvm8295"
include conf/machine/include/auto-common.inc

# sa8295 board chip belongs to Cortex-A78C-Cortex-X1C
# GCC and Clang do not support Cortex-A78C-Cortex-X1C configurations yet.
# The highest configuration currently supported is Cortex-A78C(kirkstone)
include conf/machine/include/tune-cortexa78c.inc

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-aosp-native"
PREFERRED_PROVIDER_dtc-native = "dtc-aosp-native"

PREFERRED_VERSION_linux-msm = "5.15"
PREFERRED_VERSION_linux-msm-headers = "5.15"
PREFERRED_VERSION_adsprpc = "2.0"

KERNEL_ARCH = "autogvm"
KERNEL_VARIANT = "${@bb.utils.contains_any('VARIANT', 'perf user', 'perf_', 'debug_', d)}"
KERNEL_BUILD_CONFIG = "msm-kernel/build.config.msm.${KERNEL_ARCH}.lxc"
KERNEL_IMAGE_HEADER_VERSION = "2"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/autogvm_defconfig', 'vendor/autogvm-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

MACHINE_FEATURES += "\
    qti-adsp \
    qti-bluetooth \
    qti-cdsp \
    qti-audio \
    qti-core \
    qti-extra \
    qti-tools \
    qti-hypervisor \
    qti-multimedia \
    qti-data \
    qti-display \
    qti-graphics \
    qti-security \
    qti-dual-wlan \
    qti-wlan \
    qti-camera \
    qti-vnw \
    qti-camera-qcc4 \
"
