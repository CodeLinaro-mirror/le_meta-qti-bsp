#@TYPE: Machine
#@NAME: sa7255
#@DESCRIPTION: Machine configuration for QTI sa7255

BASEMACHINE = "sa7255"
include conf/machine/include/sa7255.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

RECOVERY_IMAGE = "0"

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-gki-native"
PREFERRED_VERSION_mkbootimg-gki-native = "5.14"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 no_console_suspend=1 androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 earlycon=qcom_geni,0x99c000 qcom_geni_serial.con_enabled=1 fips=0 notests nokaslr ignore_loglevel firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=0 ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0x99c000 qcom_geni_serial.con_enabled=1', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'ro', '', d)}"

KERNEL_IMAGETYPE = "Image.gz"

IMAGE_FEATURES:append = " read-only-rootfs"

OOT_DTBS = "\
    sa7255p-ride/sa7255p-ride.dtb \
    sa8620p-ride/sa8620p-ride.dtb \
"

MACHINE_FEATURES += "\
    qti-vmm \
    qti-gunyah \
    qti-core \
    qti-tools \
    early-ramdisk-init \
    qti-umd \
    qti-display \
    qti-multimedia \
    qti-camera \
"

SECTOOLS_VERSION = "sectools-v2"

EARLY_RAMDISK_KERNEL_MODULES = "\
    kernel-module-spmi-pmic-arb-${KERNEL_VERSION} \
    kernel-module-pinctrl-spmi-gpio-${KERNEL_VERSION} \
    kernel-module-pinctrl-spmi-mpp-${KERNEL_VERSION} \
    kernel-module-nvmem-qcom-spmi-sdam-${KERNEL_VERSION} \
    kernel-module-marvell-${KERNEL_VERSION} \
    kernel-module-camcc-sa8775p-${KERNEL_VERSION} \
    kernel-module-dispcc-sa7255p-${KERNEL_VERSION} \
    kernel-module-gpucc-sa8775p-${KERNEL_VERSION} \
    kernel-module-videocc-sa8775p-${KERNEL_VERSION} \
"
