#@TYPE: Machine
#@NAME: sa8775
#@DESCRIPTION: Machine configuration for QTI sa8775

BASEMACHINE = "sa8775"
include conf/machine/include/sa8775.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

RECOVERY_IMAGE = "0"

PREFERRED_PROVIDER_mkbootimg-native = "mkbootimg-gki-native"
PREFERRED_VERSION_mkbootimg-gki-native = "5.14"

KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"
#KERNEL_CMD_PARAMS = "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0xa90000 androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 androidboot.selinux=permissive buildvariant=userdebug rootfstype=ext4 rw rootwait firmware_class.path=/firmware/image/ resume=/dev/sda8 hibernate=nocompress noswap_randomize no_console_suspend "
#KERNEL_CMD_PARAMS_append = " fsck.repair=yes "
#KERNEL_CMD_PARAMS_append = "no_hotplug_area=0x80000000,0x40000000 dyn_memhotplug "
#KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'early_init', 'early_userspace ', '', d)}"
#KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200n8', '', d)}"
#KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=msm_geni_serial,0xa90000', '', d)}"
#KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'no_console_suspend', '', d)}"
#KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
#KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'lxc', ' androidboot.android_dt_dir=/skip/ ', '', d)}"
#KERNEL_CMD_PARAMS_append = "${@bb.utils.contains('DISTRO_FEATURES', 'lxc', 'androidboot.console=tty30', '', d)}"
KERNEL_CMD_PARAMS = "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x884000 rw rootwait rootfstype=ext4 firmware_class.path=/firmware/image/ no_console_suspend=1 pcie_ports=compat"
KERNEL_IMAGETYPE = "Image.gz"

IMAGE_FEATURES:append = " read-only-rootfs"

MACHINE_FEATURES += "\
    qti-core \
    qti-tools \
"
