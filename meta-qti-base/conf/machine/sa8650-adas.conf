#@TYPE: Machine
#@NAME: sa8650-adas
#@DESCRIPTION: Machine configuration for QTI sa8650-adas

BASEMACHINE = "sa8650-adas"
include conf/machine/include/sa8775.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

RECOVERY_IMAGE = "0"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom"
PREFERRED_PROVIDER_virtual/kernel-headers = "linux-qcom-headers"
PREFERRED_VERSION_linux-qcom = "6.6"
preferred-kernel = "PREFERRED_VERSION_linux-qcom"
kernel-version = "${PREFERRED_VERSION_linux-qcom}"

KERNEL_ARCH = "gen4auto"
KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"
KERNEL_MACHINE_DTB = "arch/arm64/boot/dts/qcom/sa8775p-ride.dtb"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 no_console_suspend=1 androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 earlycon=qcom_geni,0xa8c000 fips=0 notests nokaslr ignore_loglevel firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket systemd.unified_cgroup_hierarchy=1 qcom_scm.download_mode=1"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=0 ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0xa8c000', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"

KERNEL_IMAGETYPE = "Image"

OOT_DTBS = "centos-stream-9/arch/arm64/boot/dts/qcom/sa8775p-ride-fw-managed.dtb.overlay"

MACHINE_FEATURES:remove = "\
    qti-multimedia \
    qti-display \
    qti-audio \
    qti-vmm \
    qti-camera \
    qti-safety \
    qti-vnw \
    early-ramdisk-init \
    qti-gunyah \
    qti-compute-platform \
"
