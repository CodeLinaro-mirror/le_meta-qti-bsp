#@TYPE: Machine
#@NAME: quin-gvm-gen4-5
#@DESCRIPTION: Machine configuration for QTI Quin GVM GEN4.5 Platform

BASEMACHINE ?= "quin-gvm-gen4-5"
include conf/machine/include/auto-common.inc

#MASK unused recipe in target
include conf/machine/include/gvm-bbmask.inc
include conf/distro/include/gvm-bbmask-prop.inc

include conf/machine/include/tune-cortexa78c.inc

PREFERRED_PROVIDER_dtc-native = "dtc-aosp-native"

PREFERRED_VERSION_linux-msm = "6.12"
PREFERRED_VERSION_linux-msm-headers = "6.12"
PREFERRED_VERSION_adsprpc = "2.0"
PREFERRED_VERSION_media-codec2 = "auto.1.0"
PREFERRED_VERSION_media-external = "auto.1.0"
PREFERRED_VERSION_media-noship = "auto.1.0"
PREFERRED_VERSION_codec2-service = "auto.1.0"

TUNE_CCARGS:remove:toolchain-clang = "-mbranch-protection=standard"

# gvm prefer camx
PREFERRED_VERSION_cameradlkm = "0.2"

KERNEL_ARCH = "autogvm"
KERNEL_VARIANT = "${@bb.utils.contains_any('VARIANT', 'perf user', 'perf_', 'debug_', d)}"
KERNEL_BUILD_CONFIG = "msm-kernel/build.config.msm.${KERNEL_ARCH}.lxc"
KERNEL_IMAGE_HEADER_VERSION = "2"

KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "${@['vendor/autogvm_defconfig', 'vendor/autogvm-debug_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"
KERNEL_CMD_PARAMS = " "
KERNEL_IMAGETYPE = "Image"

KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=1 ', '', d)}"

EARLY_RAMDISK_KERNEL_MODULES = "\
    kernel-module-virtio-mmio-${KERNEL_VERSION} \
    kernel-module-failover-${KERNEL_VERSION} \
    kernel-module-net-failover-${KERNEL_VERSION} \
    kernel-module-virtio-net-${KERNEL_VERSION} \
    kernel-module-msm-hab-${KERNEL_VERSION} \
    kernel-module-crypto-qti-virt-${KERNEL_VERSION} \
    kernel-module-virtio-blk-${KERNEL_VERSION} \
    kernel-module-virtio-blk-qti-crypto-${KERNEL_VERSION} \
"

MACHINE_FEATURES += "\
    qti-core \
    qti-tools \
    qti-hypervisor \
    qti-data \
    qti-dlkm \
    qti-multimedia \
    qti-security \
    qti-bluetooth \
    qti-adsp \
    qti-cdsp \
    qti-cdsp1 \
    qti-extra \
    qti-wlan \
    qti-wlan-hsp \
    qti-wlan-genoa \
    qti-camera \
    qti-graphics \
    qti-display \
    qti-audio-ar \
    qti-vnw \
    early-ramdisk-init \
"

MACHINE_FEATURES:remove = "\
    qti-lxc \
    qti-multimedia \
    qti-security \
    qti-bluetooth \
    qti-wlan \
    qti-wlan-hsp \
    qti-wlan-genoa \
    qti-camera \
    qti-graphics \
    qti-display \
    qti-audio-ar \
    qti-vnw \
"
