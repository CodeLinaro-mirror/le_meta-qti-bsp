# Use a local timeserver
server 192.168.100.1 iburst minpoll 2

# Sync the start of second using PPS
refclock PPS /dev/pps0 refid KPPS trust

# Always step the system clock if the adjustment is larger
# than 100 milliseconds.
makestep 0.1 -1

# Record the rate at which the system clock gains/loses time,
# improving accuracy after reboot
driftfile /var/lib/chrony/drift

# Specify directory for log files.
logdir /var/log/chrony

# Select which information is logged.
log measurements statistics tracking
