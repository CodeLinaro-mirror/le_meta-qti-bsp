BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "qti-lxc"
BBFILE_PRIORITY_qti-lxc = "11"
BBFILE_PATTERN_qti-lxc := "^${LAYERDIR}/"
QTI_METAPATH_LXC := '${@os.path.normpath("${LAYERDIR}/")}'
