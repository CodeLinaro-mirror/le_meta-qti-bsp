#@TYPE: Machine
#@NAME: MDM9650
#@DESCRIPTION: Machine configuration for QTI MDM9650-4K

require conf/machine/include/mdm9650.inc

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE ?= "120MiB"
CACHE_VOLUME_SIZE ?= "15MiB"
SYSTEMRW_VOLUME_SIZE ?= "6MiB"
PERSIST_VOLUME_SIZE ?= "6MiB"

PAGE_SIZE = '4096'
UBINIZE_ARGS = "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_USERFS_ARGS = "-m 4096 -e 253952 -c 2146 -F"
