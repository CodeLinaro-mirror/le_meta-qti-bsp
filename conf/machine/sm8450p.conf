#@TYPE: Machine
#@NAME: Waipio
#@DESCRIPTION: Machine configuration for Waipio

require conf/machine/include/sm8450p.inc

KERNEL_IMAGETYPE   = "Image"

MACHINE_SUPPORTS_DTBO = "True"
KERNEL_DTB_NAMES   = " \
    waipio-v2.dtb \
"
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_DEFCONFIG = "waipio_le-defconfig"
KERNEL_DEFCONFIG_qti-distro-debug ?= "waipio_le-debug_defconfig"
KERNEL_PREBUILT_PATH = "${WORKSPACE}/kernel-5.10/out/${KERNEL_DEFCONFIG}"

KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"

KERNEL_MODULES_LIST = "modules.list.waipio_le"

KERNEL_BASE        = "0x80000000"

KERNEL_CONFIG     ?= "build.config.waipio_le"
KERNEL_CONFIG_qti-distro-debug ?= "build.config.waipio_le"

CONSOLE_PARAM     ?= ""
CONSOLE_PARAM_qti-distro-debug ?= "earlycon msm_geni_serial.con_enabled=1 earlycon=msm_geni_serial,0x00A94000"

KERNEL_CMD_PARAMS  = "${CONSOLE_PARAM} verity=enabled"

SERIAL_CONSOLES    ?= ""
SERIAL_CONSOLES_qti-distro-debug = "115200;ttyMSM0"

# bootloader configuration
EXTRA_IMAGEDEPENDS += "edk2"

# Default USB composition to be picked
USBCOMPOSITION = "9060"

# Conf with partition entries required for machine.
MACHINE_PARTITION_CONF = "sm8450p-partition.conf"

# filesystem configurations to be applied on image.
MACHINE_FSCONFIG_CONF = "sm8450p-fsconfig.conf"

# init ramdisk image to be used for first stage boot.
INITRAMFS_IMAGE = "qti-ramdisk-image"
INITRAMFS_FSTYPES = "cpio.lz4"
VENDOR_INITRAMFS_IMAGE = "qti-vendor-ramdisk-image"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "sm8450p-filesmap"

# Enable qti-ab-boot feature with OTA package
GENERATE_AB_OTA_PACKAGE = "1"

#do not redirect system and journal logs to console
NO_SYS_JOURNAL_LOGS_TO_CONSOLE = "1"

#Flag to disable usbd.service
USB_PERIPHERAL_ONLY_MODE = "True"

# MACHINE_FEATURES ##
# emmc-boot:            Machine supports eMMC device
# drm :                 Machine supports DRM display drivers
# qti-adsp:             Machine supports QTI adsp solution
# qti-cdsp:             Machine supports QTI cdsp solution
# qti-eva:              Machine supports QTI eva solution
# qti-camera:           Machine supports QTI camera solution
# qti-ab-boot:          Machine supports a/b boot
# qti-abc-boot:         Machine supports a/b/c boot

MACHINE_FEATURES += "drm emmc-boot qti-adsp qti-cdsp qti-eva qti-camera qti-ab-boot dm-verity-initramfs-v2 qti-sensors qti-wifi qwesd file-based-encryption qti-codec2 qti-qseecom"

# When A/B/C boot is enabled assume A/B is also enabled
MACHINE_FEATURES_BACKFILL_append = " ${@bb.utils.contains('MACHINE_FEATURES', 'qti-abc-boot', 'qti-ab-boot', '',d)}"
