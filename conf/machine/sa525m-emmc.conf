#@TYPE: Machine
#@NAME: SA525M-EMMC
#@DESCRIPTION: Machine configuration for SA525M EMMC

require conf/machine/include/sa525m.inc

# MACHINE_FEATURES ##
MACHINE_FEATURES += "emmc-boot qti-ab-boot dm-verity-none "

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4  ?= "268435456"
USERDATA_SIZE_EXT4 ?= "251658240"

SDCARD_DEVICE = "mmcblk1p1"
SLOT_A_SUFFIX = ""

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
#MACHINE_SUPPORTS_INIT_RAMDISK = "True"
#TOYBOX_RAMDISK = "True"
MACHINE_FSCONFIG_CONF = "sa525m-emmc-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF_EMMC = "sa525m-emmc-filesmap"

MACHINE_PARTITION_CONF = "sa525m-partition.conf"

MACHINE_FEATURES_remove += "qti-recovery qti-bluetooth qti-nad-telaf qti-nad-mrc dm-verity-initramfs-v4"

FLAVOR = "pvm"
