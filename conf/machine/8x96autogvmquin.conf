#@TYPE: Machine
#@NAME: msm8996

#@DESCRIPTION: Machine configuration for msm systems

MACHINE_EXTRA_RRECOMMENDS = " kernel-modules kernel-devicetree"

require conf/machine/include/8x96autogvmquin.inc

IMAGE_FSTYPES += "tar.bz2 ext4"

PREFERRED_PROVIDER_virtual/kernel = "linux-gvm-4.4"

#
# Graphics driver essentials
#
PREFERRED_PROVIDER_virtual/wayland-egl  = "adreno"
PREFERRED_PROVIDER_virtual/egl          = "adreno"
PREFERRED_PROVIDER_virtual/libgles1     = "adreno"
PREFERRED_PROVIDER_virtual/libgles2     = "adreno"

# for dm-verity
ROOT_DEVICE = "/dev/vda"
KERNEL_ROOTDEVICE = "/dev/dm-0"


SERIAL_CONSOLE ?= "115200 ttyAMA0"

KERNEL_IMAGETYPE ?= "Image"
KERNEL_DEVICETREE ?= "qcom/vplatform-lfv-msm8996.dtb"
KERNEL_DTS_NAME = "vplatform-lfv-msm8996"
KERNEL_BASE ?= "0x80000000"
#TODO: dynamically set root device based on board version
KERNEL_CMDLINE ?= "console=ttyAMA0,115200"

KERNEL_DEFCONFIG = "msm-auto-gvm_defconfig"
KERNEL_PERF_DEFCONFIG = "msm-auto-gvm-perf_defconfig"

# Sizes for EXT4 (in bytes)
USERDATA_SIZE_EXT4 = "2000000000"
CACHE_SIZE_EXT4 = "80000000"

DISTRO_FEATURES_append = " persist-image"

BBMASK_append = "|meta-qti-display/recipes-products/images/machine-qsap-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes-products/images/machine-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes-products/images/machine-minimal-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes/drm/libdrm_%.bbappend"
BBMASK_append = "|meta-qti-display/recipes/wayland/wayland_1.9.0.bb"
BBMASK_append = "|meta-qti-display/recipes/wayland/weston-init.bbappend"
BBMASK_append = "|meta-qti-display/recipes/wayland/weston_1.9.0.bbappend"
BBMASK_append = "|meta-qti-bsp/recipes-display/display-hal/display-hal-linux_git.bb"
BBMASK_append = "|meta-qti-bsp/recipes-display/display-hal/display-hal_git.bb"
BBMASK_append = "|meta-qti-bsp/recipes-display/sdm/sdm.bb"
BBMASK_append = "|meta-qti-bsp/recipes-graphics/wayland/weston_%.bbappend"
