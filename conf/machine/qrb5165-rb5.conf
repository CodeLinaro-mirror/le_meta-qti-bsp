#@TYPE: Machine
#@NAME: qrb5165-rb5 dev kit
#@DESCRIPTION: Machine configuration for RB5 dev kit based on QRB5165

require conf/machine/include/qrb5165.inc

### dtb ###
KERNEL_DTB_NAMES   = "vendor/qcom/kona-7230-iot-v2.1.dtb vendor/qcom/qrb5165-iot.dtb vendor/qcom/qrb5165n-iot.dtb vendor/qcom/qrb3165-iot.dtb vendor/qcom/qrb3165n-iot.dtb "

### boot.img ###
KERNEL_IMAGETYPE   = "Image"
KERNEL_BASE        = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
#KERNEL_TAGS_OFFSET = "0x81900000"
BOOT_HEADER_VERSION = "2"

#KERNEL_CONFIG     ?= "vendor/kona-perf_defconfig"
#KERNEL_CONFIG_qti-distro-debug ?= "vendor/kona_defconfig"

CONSOLE_PARAM     ?= ""
CONSOLE_PARAM:qit-distro-perf  ?= "console=ttyMSM0,115200n8"
CONSOLE_PARAM:qti-distro-debug ?= "console=ttyMSM0,115200n8 earlycon=qcom_geni,0xa90000 qcom_geni_serial.con_enabled=1 androidboot.console=ttyMSM0"

KERNEL_CMD_PARAMS  = "noinitrd ${CONSOLE_PARAM} androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 swiotlb=2048 loop.max_part=7 cgroup.memory=nokmem,nosocket reboot=panic_warm net.ifnames=0"

PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg-gki"
PREFERRED_PROVIDER_virtual/mkdtimg   = "mkdtimg-gki"

PREFERRED_VERSION:linux-msm ?= "5.15"
PREFERRED_VERSION:linux-msm-headers ?= "5.15"
PREFERRED_VERSION:kernel-toolchain ?= "5.15"
PREFERRED_VERSION:dtc-android-build ?= "5.15"
PREFERRED_VERSION:mkbootimg-gki ?= "5.15"


#### Kernel ####
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_MODULES_LIST = "modules.list.msm.kona.le"
KERNEL_VARIANT:qti-distro-debug ?= "consolidate"
KERNEL_VARIANT:qti-distro-perf ?= "gki"

KERNEL_DEFCONFIG = "msm-kernel-kona_le-${KERNEL_VARIANT}"

INITRAMFS_IMAGE = "qti-ramdisk-image"
INITRAMFS_FSTYPES = "cpio.lz4"
VENDOR_INITRAMFS_IMAGE = "qti-vendor-ramdisk-image"

#Various kernel directories
KERNEL_PLATFORM_PATH = "${WORKSPACE}/kernel-5.15/kernel_platform"
KERNEL_PREBUILT_PATH = "${WORKSPACE}/kernel-5.15/out/${KERNEL_DEFCONFIG}"
KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"

KERNEL_CONFIG  ?= "build.config.msm.kona.le"

UFS_BSG_DEV_USAGE = "True"

MACHINE_SUPPORTS_DTBO= "True"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "False"

MACHINE_FEATURES += "dm-verity-none"

SERIAL_CONSOLE    ?= ""
SERIAL_CONSOLE:qti-distro-debug ?= "115200 ttyMSM0"

# bootloader configuration
EXTRA_IMAGEDEPENDS += "edk2"
PREFERRED_VERSION_edk2 ?= "4.0"

PREFERRED_PROVIDER_virtual/libgles1 = "adreno"
PREFERRED_PROVIDER_virtual/libgles2 = "adreno"
PREFERRED_PROVIDER_virtual/egl      = "adreno"

# Conf with partition entries required for machine.
MACHINE_PARTITION_CONF = "qrb5165-rb5-partition.conf"

# filesystem configurations to be applied on image.
MACHINE_FSCONFIG_CONF = "qrb5165-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "kona-filesmap"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 = "8589934592"
USERDATA_SIZE_EXT4 = "103079215104"

GENERATE_AB_OTA_PACKAGE = "0"

KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.kona.le \
    modules.systemdlkm_blocklist.msm.kona.le \
"
#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

MACHINE_SUPPORTS_PDMAPPER = "False"

# MACHINE_FEATURES ##
# emmc-boot:            Machine supports eMMC device
# ubwc:                 Machine supports UBWC hardware
# qti-wifi:             Machine supports QTI WiFi solution
# qti-audio:            Machine supports QTI audio solution
# qti-audio-encoder:    Machine supports QTI audio encoder
# qti-audio-cal:        Machine supports QTI audio calibration solution
# qti-adsp:             Machine supports QTI adsp solution
# qti-cvp:               Machine supports QTI cvp solution
# qti-ab-boot:          Machine support a/b boot
# opencl:               Machine supports OpenCL driver
# qti-tflite-delegate:  Machine supports tensorflow lite hardware acceleration
# drm :                 Machine supports DRM display drivers
# dm-verity-bootloader: Machine supports bootloader-based dm-verity implementation
# qti-security:         Support QTI security solution
# qti-gst-ros2:         Machine supports QTI Gst Ros2 solution
# qti-fscrypt:          Machine supports FBE using fscrypt

DISTRO_FEATURES:remove = "selinux"

MACHINE_FEATURES += "emmc-boot ubwc qti-wifi hasting qti-adsp qti-audio qti-audio-encoder \
                     qti-audio-cal qti-ab-boot qti-cdsp qti-cvp opencl qti-tflite-delegate \
                     qti-camera drm qti-npu qti-security qti-gst-ros2 \
                     qti-slpi qti-sensors qti-fscrypt tdk-sensors qti-display"
