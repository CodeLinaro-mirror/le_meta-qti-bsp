#@TYPE: Machine
#@NAME: MDM9607 CDP
#@DESCRIPTION: Machine configuration for QTI MDM9607 CDP

# Enable hard-float compilation if FLOATABI variable is set to hard,
# if not set it to armv7a-neon.
# FLOATABI can be defined in set_env_bb.sh
DEFAULTTUNE ?= "${@bb.utils.contains('FLOATABI', 'hard', 'cortexa8hf-neon', 'armv7a-neon', d)}"
# Defines floating-point ABI value suitable to pass to gcc compile flag
# permissable values:hard & softfp.hard allows generation of floating-point
# instructions and uses FPU-specific calling conventions.softfp allows the
# generation of code using hardware floating-point instructions, but still
# uses the soft-float calling conventions. ARM_FLOAT_ABI is set based on
# FLOATABI variable.
ARM_FLOAT_ABI ?= "${@bb.utils.contains('FLOATABI', 'hard', 'hard', "", d)}"

require conf/machine/include/mdm9607.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-quic"


KERNEL_IMAGETYPE = "zImage"
KERNEL_DTS_NAME = "mdm9607"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81E00000"
KERNEL_DEFCONFIG = "${@base_contains('PRODUCT', 'psm', 'mdm9607-128mb-perf_defconfig', 'mdm9607_defconfig', d)}"
KERNEL_PERF_DEFCONFIG = "mdm9607-perf_defconfig"
KERNEL_CMD_PARAMS = "noinitrd ro console=ttyHSL0,115200,n8 androidboot.hardware=qcom ehci-hcd.park=3 msm_rtb.filter=0x37 lpm_levels.sleep_disabled=1 earlycon=msm_hsl_uart,0x78b3000"

# Pull in security flags
require ${COREBASE}/meta-qti-bsp/conf/distro/include/security_flags.inc
