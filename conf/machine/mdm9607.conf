#@TYPE: Machine
#@NAME: MDM9607
#@DESCRIPTION: Machine configuration for QTI MDM9607

BASEMACHINE ?= "mdm9607"
require conf/machine/include/basemachine.inc

SOC_FAMILY ?= "mdm9x07"
include conf/machine/include/soc-family.inc

#32 bit
DEFAULTTUNE ?= "armv7athf-neon"
include conf/machine/include/arm/arch-armv7a.inc


PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg"
PREFERRED_PROVIDER_virtual/mkbootimg-native = "mkbootimg-native"
PREFERRED_PROVIDER_virtual/kernel = "linux-msm"
PREFERRED_VERSION_linux-msm ?= "6.1"
PREFERRED_VERSION_linux-msm-headers ?= "6.1"
PREFERRED_VERSION_kernel-toolchain ?= "6.1"
PREFERRED_VERSION_dtc-android-build ?= "6.1"
PREFERRED_VERSION_kernel-toolchain-native = "6.1.32bit"

#### KERNEL ####
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_VARIANT:qti-distro-debug ?= "-debug_defconfig"
#KERNEL_VARIANT:qti-distro-perf ?= "_defconfig"
#With bazel
KERNEL_VARIANT:qti-distro-perf ?= "-perf_defconfig"
KERNEL_MODULES_LIST = "modules.list.msm.mdm9607.le"
KERNEL_MODULES_BLACKLIST = "" 

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""
KERNEL_DEFCONFIG = "mdm9607${KERNEL_VARIANT}"

#Various kernel directories
KERNEL_PLATFORM_PATH = "${WORKSPACE}/kernel-6.1/kernel_platform"
# With KbDev
#KERNEL_PREBUILT_PATH = "${WORKSPACE}/kernel-6.1/out/${KERNEL_DEFCONFIG}"
#KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"
#KERNEL_TYPE = "msm-kernel"

# With bazel
KERNEL_PREBUILT_PATH = "${KERNEL_PLATFORM_PATH}/out/msm-kernel-${KERNEL_DEFCONFIG}"
KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"
KERNEL_TYPE = "dist"

KERNEL_OUT_PATH = "${KERNEL_PREBUILT_PATH}"
KERNEL_BUILD_CONFIG = "msm-kernel/build.config.msm.mdm9607"

# Set sectool5 as preffered provider for signing
PREFERRED_PROVIDER_virtual/signtools-native = "sectool5-native"
ENABLE_SIGNED_IMAGES = "1"
SECTOOLS_PY_DIR = "${KERNEL_PLATFORM_PATH}/prebuilts/qcom_boot_artifacts/sectools/sectoolsv1"
KERNEL_CONFIG = "vendor/${KERNEL_DEFCONFIG}"
ENABLE_DDK_BUILD="true"
TARGET_BOARD_PLATFORM="mdm9607"

#### dtb ####
KERNEL_DTB_NAMES = "mdm9607-mtp.dtb \
                    mdm9607-cdp.dtb \
                    mdm9607-rcm.dtb \
		    "

MACHINE_SUPPORTS_DTBO= "False"
SKIP_VENDOR_BOOT = "True"
# Set selinux in permissive state by default
DEFAULT_ENFORCING = "permissive"
QIMGEXTENSION   += "qsigning"

SERIAL_CONSOLES ?= "115200;ttyMSM0"
KERNEL_IMAGETYPE = "zImage"
#KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81E00000"
BOOT_HEADER_VERSION = "1"

KERNEL_CMD_PARAMS = "noinitrd ro rootwait earlycon=msm_serial_dm,0x78b3000 console=ttyMSM0,115200,n8 \
                     no_console_suspend=1 androidboot.hardware=qcom androidboot.console=ttyMSM0 \
                     lpm_levels_legacy.sleep_disabled=1 service_locator.enable=1 \
                     firmware_class.path=/lib/firmware/updates msm_rtb.filter=0x237 \
                     "

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

# Bootloader configuration
EXTRA_IMAGEDEPENDS += "lk"

# MACHINE_FEATURES ##
# qti-security:           Machine supports QTI security solution
# qti-wifi:               Machine supports QTI WiFi solution
# qti-audio:              Machine supports QTI audio solution
# qti-bluetooth:          Machine supports QTI bluetooth solution
# qti-location:           Machine supports Location solution
# qti-data-modem:         Machine supports QTI data modem solution

MACHINE_FEATURES += "qti-security dm-verity-none nand-boot qti-data-modem qti-modem qti-location qti-wifi qti-bluetooth qti-audio qti-qseecom qti-tzlog qti-recovery "

MACHINE_MNT_POINTS = " \
    /firmware \
    /persist \
    /cache \
    /data \
 "

# Formats of root filesystem images
IMAGE_FSTYPES += "ubi"

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE ?= "74MiB"
SYSTEM_VOLUME_SIZE_2K ?= "57MiB"
CACHE_VOLUME_SIZE ?= "37MiB"
CACHE_VOLUME_SIZE_2K ?= "1MiB"
SYSTEMRW_VOLUME_SIZE ?= "1MiB"
PERSIST_VOLUME_SIZE ?= "6MiB"

PAGE_SIZE ?= '4096'
PAGE_SIZE_2K ?= '2048'
UBINIZE_ARGS ?= "-m 4096 -p 256KiB -s 4096"
UBINIZE_ARGS_2K ?= "-m 2048 -p 131072 -s 2048"
MKUBIFS_ARGS ?= "-m 4096 -e 253952 -c 2146 -F"
MKUBIFS_ARGS_2K ?= "-m 2048 -e 126976 -c 2146 -F"

MACHINE_SUPPORTS_PDMAPPER = "False"
MACHINE_SUPPORTS_INIT_RAMDISK = "False"
#MACHINE_SUPPORTS_ANDROID_PROPERTIES = "False"

# Disable autosuspend for USB peripheral mode
MACHINE_SUPPORTS_USB_AUTOSUSPEND = "False"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "mdm9607-filesmap"
MACHINE_FSCONFIG_CONF = "mdm9607-fsconfig.conf"

USBCOMPOSITION = "9025"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

PREFERRED_VERSION_protobuf = "3.11.4"
PREFERRED_VERSION_protobuf-native = "3.11.4"
PREFERRED_VERSION_iproute2 = "5.5.0"

DISTRO_FEATURES:remove = " qti-fastcv"
DISTRO_FEATURES:append  = " qti-audio"
IMAGE_FEATURES:remove:mdm9607 = " read-only-rootfs"
IMAGE_FEATURES:remove:mdm9607 = "nand2x"
CORE_IMAGE_EXTRA_INSTALL:remove:mdm9607 = "packagegroup-qti-data-1g"
CORE_IMAGE_EXTRA_INSTALL:remove:mdm9607 = "packagegroup-qti-qcc-prop"
CORE_IMAGE_EXTRA_INSTALL:remove:mdm9607 = "packagegroup-qti-ril-prop"
CORE_IMAGE_EXTRA_INSTALL:append = " packagegroup-qti-ppat"
RDEPENDS:packagegroup-qti-debug-tools:remove:mdm9607 = "valgrind"
RDEPENDS:packagegroup-qti-securemsm:remove:mdm9607 = "trustedui-noship trustedui securemsm-internal"
MACHINE_SUPPORTS_DISPLAY = "False"
