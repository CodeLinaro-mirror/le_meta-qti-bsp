#@TYPE: Machine
#@NAME: pebble
#@DESCRIPTION: Machine configuration for QTI Hardware with pebble
BASEMACHINE ?= "pebble"
require conf/machine/include/basemachine.inc

DEFAULTTUNE ?= "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

MSM_KERNEL_VERSION = "6.18"
require recipes-kernel/linux-msm/msm-common.inc

ENABLE_UEFI_EFI_BOOT = "1"
PREFERRED_VERSION_edk2 = "git"
PREFERRED_VERSION_synx-kernel ?= "1.1"
PREFERRED_VERSION_securemsmdlkm ?= "1.1"
PREFERRED_VERSION_mod-blacklist ?= "2.0"
PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg"
PREFERRED_VERSION_mkbootimg = "${MSM_KERNEL_VERSION}"
PREFERRED_VERSION_mkbootimg-native = "${MSM_KERNEL_VERSION}"

KERNEL_BUILD_TOOLS_ARCH = "linux_musl-x86"
HOSTTOOLS += "rsync nproc"

# clang version for kernel toolchain 6.18
USE_CLANG = "True"
CLANG_VERSION = "r584948"

#### KERNEL ####
KERNEL_SRC_TYPE = "soc-repo"
KERNEL_MODULES_LIST = "modules-lists/modules.list.msm.pebble-le"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.pebble-le \
    modules.systemdlkm_blocklist.msm.pebble-le \
"
KERNEL_DEFCONFIG_VARIANT:qti-distro-debug = "debug-defconfig"
KERNEL_DEFCONFIG_VARIANT:qti-distro-perf = "defconfig"

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

# enable DDK build
DDK_BUILD = "true"

KERNEL_CONFIG  ?= "build.config.msm.pebble.le"
KERNEL_BUILD_CONFIG = "soc-repo/${KERNEL_CONFIG}"

#### dtb ####
KERNEL_DTB_NAMES = "pebble.dtb pebblep.dtb art.dtb arth.dtb artl.dtb artp.dtb artp-v2.dtb art-v2.dtb"

MACHINE_SUPPORTS_DTBO= "True"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "False"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

#### cmdline ####
CONSOLE_PARAM:qti-distro-perf  = ""
CONSOLE_PARAM:qti-distro-debug = "console=ttyMSM0,115200n8 kasan.stacktrace=off stack_depot_disable=off page_owner=on no_hash_pointers panic_on_taint=0x20 slub_debug=FZP,zs_handle,zspage;FZPU qcom_geni_serial.con_enabled=1 earlycon"
HIBERNATION_PAPAMS = "hibernate=nocompress"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM}"

#### others ####
PAGE_SIZE ?= '4096'
SDCARD_DEVICE = "mmcblk1p1"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

#QSEEComCompat and QSEECom are mutually exlusive and QSEEComCompat depends on  smcinvoke
#lv-build builds the required listernes , le_qseecom enables qseecomd
MACHINE_FEATURES += "dm-verity-none"

MACHINE_MNT_POINTS = " \
	/persist \
	/firmware \
	/bt_firmware \
	/dsp \
	/overlay \
"

SYSTEM_SIZE_EXT4   ?= "4026531840"
PERSIST_SIZE_EXT4 ?= "7MiB"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"
USERDATA_SIZE ?= "60GiB"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "False"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "pebble-fsconfig.conf"
MACHINE_SUPPORTS_DISPLAY = "False"
MACHINE_SUPPORTS_SSR = "False"

USBCOMPOSITION = "4EE7"

# Partition conf
MACHINE_PARTITION_CONF = "pebble-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "pebble-filesmap"

### MACHINE_FEATURES ###
#MACHINE_FEATURES += "qti-ab-boot qti-adsp qti-cdsp fastrpc qti-tzlog qti-crypto qti-security qseecompat qti-smciqseecomd"
MACHINE_FEATURES += "qti-ab-boot"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

DISTRO_FEATURES:remove = "qti-vble qti-sensors qti-sensors-prop qti-location qti-fastcv ros2 qirp-sdk qti-ib2c qti-auto-framing-stabilization"
# DISTRO_FEATURES:append = " qti-uvc"

QPERMISSIONS_ENABLE = "1"

# SELinux is set in enforcing mode, by default, as below;
# DEFAULT_ENFORCING ?= "enforcing"
# During bring up, to unblock the technology teams, SELinux is set to permissive.
##############################################################
# DEFAULT_ENFORCING = "enforcing"
DISTRO_FEATURES:remove = "selinux"
DISTRO_EXTRA_RDEPENDS:remove = "packagegroup-selinux-minimal"
PREFERRED_PROVIDER_virtual/refpolicy = ""

# pack for installation of ESDK
COREBASE_FILES:append = " meta-poky"

GENERATE_AB_OTA_PACKAGE = "0"
