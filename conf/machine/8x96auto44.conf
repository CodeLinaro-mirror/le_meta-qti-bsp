#@TYPE: Machine
#@NAME: 8x96auto44

#@DESCRIPTION: Machine configuration for 8x96auto kernel4.4

require conf/machine/include/8x96auto.inc

MACHINE_EXTRA_RRECOMMENDS = " kernel-modules kernel-devicetree"

IMAGE_FSTYPES += "tar.bz2 ext4"

PREFERRED_PROVIDER_virtual/kernel = "linux-msm-4.4-8996"

CONSOLE_DEVICE = "ttyMSM0"

#
# Graphics driver essentials
#
PREFERRED_PROVIDER_virtual/wayland-egl  = "adreno"
PREFERRED_PROVIDER_virtual/egl          = "adreno"
PREFERRED_PROVIDER_virtual/libgles1     = "adreno"
PREFERRED_PROVIDER_virtual/libgles2     = "adreno"

KERNEL_IMAGETYPE ?= "Image.gz-dtb"
KERNEL_DTS_NAME = "msm8996"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81900000"
KERNEL_CMD_PARAMS = "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 cma=16M@0-0xffffffff rootwait rootfstype=ext4 root=/dev/mmcblk0p18"

KERNEL_DEFCONFIG = "msm-auto_defconfig"
KERNEL_PERF_DEFCONFIG = "msm-auto-perf_defconfig"

SERIAL_CONSOLE = "115200 ${CONSOLE_DEVICE}"
