#@TYPE: Machine
#@NAME: qrbx210-rbx
#@DESCRIPTION: Machine configuration for qrbx210-rbx

require conf/machine/include/qrbx210.inc

######################## Start of KERNEL ############################
# clang version for kernel toolchain 6.12
CLANG_VERSION = "r536225"

KERNEL_SRC_TYPE = "soc-repo"
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_VARIANT:qti-distro-debug ?= "debug-defconfig"
KERNEL_VARIANT:qti-distro-perf ?= "defconfig"
BUILD_VARIANT:qti-distro-debug ?= "debug_defconfig"
BUILD_VARIANT:qti-distro-perf ?= "defconfig"
KERNEL_MODULES_LIST = "modules-lists/modules.list.msm.bengal-le"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.bengal-le \
    modules.systemdlkm_blocklist.msm.bengal-le \
"
KERNEL_DEFCONFIG_VARIANT:qti-distro-debug ?= "debug-defconfig"
KERNEL_DEFCONFIG_VARIANT:qti-distro-perf ?= "defconfig"
KERNEL_DEFCONFIG = "msm-kernel-bengal_le-${BUILD_VARIANT}"

# Check for msm-kernel or gki_kernel
KERNEL_TYPE = "dist"

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

# enable DDK build
DDK_BUILD = "true"
TARGET_BOARD_PLATFORM = "bengal-le"
HOSTTOOLS += "${@bb.utils.contains('DDK_BUILD', 'true', 'rsync', '', d)}"

KERNEL_CONFIG  ?= "build.config.msm.bengal.le"
KERNEL_BUILD_CONFIG = "soc-repo/${KERNEL_CONFIG}"

#### dtb ####
KERNEL_DTB_NAMES = "qrb4210-rb2.dtb qrb4210-rb2-v2.dtb qrb4210-rb2-v3.dtb qrb4210-rb2-v4.dtb"

MACHINE_SUPPORTS_DTBO= "False"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "True"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

#### cmdline ####
CONSOLE_PARAM:qti-distro-perf  = "nosoftlockup console=ttynull qcom_geni_serial.con_enabled=0 androidboot.serialconsole=0"
CONSOLE_PARAM:qti-distro-debug = "loglevel=8 console=ttyMSM0,115200n8 qcom_geni_serial.con_enabled=1 earlycon=qcom_geni,0x4a90000 androidboot.serialconsole=1"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM} verity=enabled"

#### others ####
PAGE_SIZE ?= '4096'
SDCARD_DEVICE = "mmcblk1p1"

#Abl would be enabled later
EXTRA_IMAGEDEPENDS += "edk2"
PREFERRED_VERSION_edk2 ?= "4.0"

require recipes-kernel/linux-msm/msm-common.inc
########################End of KERNEL ############################

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 = "3221225472"
USERDATA_SIZE = "4294967296"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "qrbx210-fsconfig.conf"
MACHINE_SUPPORTS_DISPLAY = "False"
MACHINE_SUPPORTS_SSR = "False"

USBCOMPOSITION = "901D"

# Partition conf
MACHINE_PARTITION_CONF = "qrbx210-rbx-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "bengal-filesmap"

# pack for installation of ESDK
COREBASE_FILES:append = " meta-poky"

PREFERRED_VERSION_mod-blacklist ?= "2.0"

### MACHINE_FEATURES ###
MACHINE_FEATURES += "qti-ab-boot qti-security qti-tzlog qti-qseecom smcinvoke qti-tmecom qti-rpmb gptee qti-crypto qti-gp-reqcancel"
MACHINE_FEATURES += "qti-adsp"
MACHINE_FEATURES += "qti-cdsp"
MACHINE_FEATURES += "fastrpc"
MACHINE_FEATURES += "dm-verity-initramfs-v3"
MACHINE_FEATURES += "qti-audio"
MACHINE_FEATURES += "qti-video"

#Temp change for bringup dry run
DISTRO_FEATURES:remove += "qti-sensors qti-sensors-prop qti-location"

DISTRO_FEATURES:remove = "ros2 qirp-sdk qti-ib2c qti-uvc qti-umd-gadget qti-auto-framing-stabilization"

DEFAULT_ENFORCING = "enforcing"
