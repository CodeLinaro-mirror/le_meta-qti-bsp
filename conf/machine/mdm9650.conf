#@TYPE: Machine
#@NAME: MDM9650
#@DESCRIPTION: Machine configuration for QTI MDM9650

require conf/machine/include/mdm9650.inc

# Sizes for UBI volumes
SYSTEM_VOLUME_SIZE ?= "120MiB"
CACHE_VOLUME_SIZE ?= "15MiB"
SYSTEMRW_VOLUME_SIZE ?= "6MiB"
PERSIST_VOLUME_SIZE ?= "6MiB"

PAGE_SIZE = '2048'
UBINIZE_ARGS = "-m 2048 -p 128KiB -s 2048"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 2047 -F"
MKUBIFS_USERFS_ARGS = "-m 2048 -e 126976 -c 2047 -F"
