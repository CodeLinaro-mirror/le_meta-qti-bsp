#@TYPE: Machine
#@NAME: kera
#@DESCRIPTION: Machine configuration for QTI HDK with kera
BASEMACHINE ?= "kera"
require conf/machine/include/basemachine.inc

DEFAULTTUNE ?= "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

require recipes-kernel/linux-msm/msm-common.inc

PREFERRED_VERSION_synx-kernel ?= "1.0"
PREFERRED_VERSION_securemsmdlkm ?= "1.1"
PREFERRED_VERSION_touchdlkm = "1.0"

#### KERNEL ####
DDK_BUILD = "false"
MSM_KERNEL_VERSION = "6.6"
KERNEL_VARIANT:qti-distro-debug = "debug_defconfig"
KERNEL_VARIANT:qti-distro-perf = "perf_defconfig"
BUILD_VARIANT:qti-distro-debug = "debug_defconfig"
BUILD_VARIANT:qti-distro-perf = "perf_defconfig"

KERNEL_MODULES_LIST = "modules.list.msm.kera-le"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.kera-le \
    modules.systemdlkm_blocklist.msm.kera-le \
"
KERNEL_CONFIG  ?= "build.config.msm.kera.le"
KERNEL_BUILD_CONFIG = "msm-kernel/${KERNEL_CONFIG}"

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

INITRAMFS_IMAGE = "early-ramdisk-image"

#### dtb ####
KERNEL_DTB_NAMES = "kera.dtb kerap.dtb kera-iot.dtb kerap-iot.dtb"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

#### cmdline ####
CONSOLE_PARAM:qti-distro-perf  = "qcom_geni_serial.con_enabled=0 lpm_levels.sleep_disabled=1 rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=1 log_buf_len=1M systemd.setenv="SLOT_SUFFIX=_a""
CONSOLE_PARAM:qti-distro-debug = "console=ttyMSM0,115200n8 kasan.stacktrace=off stack_depot_disable=off page_owner=on no_hash_pointers panic_on_taint=0x20 slub_debug=FZP,zs_handle,zspage;FZPU qcom_geni_serial.con_enabled=1 earlycon systemd.log_target=journal systemd.show_status=no rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=1 log_buf_len=1M systemd.setenv="SLOT_SUFFIX=_a" ufshcd_core.uic_cmd_timeout=2000"
HIBERNATION_PAPAMS = "hibernate=nocompress"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM}"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

#QSEEComCompat and QSEECom are mutually exlusive and QSEEComCompat depends on  smcinvoke
#lv-build builds the required listernes , le_qseecom enables qseecomd
MACHINE_FEATURES += "dm-verity-none"

MACHINE_MNT_POINTS = " \
	/persist \
	/firmware \
	/bt_firmware \
	/dsp \
	/overlay \
"

SYSTEM_SIZE_EXT4   ?= "4026531840"
PERSIST_SIZE_EXT4 ?= "7MiB"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"
USERDATA_SIZE ?= "19GiB"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "kera-fsconfig.conf"
MACHINE_SUPPORTS_DISPLAY = "False"
MACHINE_SUPPORTS_SSR = "True"

USBCOMPOSITION = "901D"

# Partition conf
MACHINE_PARTITION_CONF = "kera-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "kera-filesmap"

### MACHINE_FEATURES ###
MACHINE_FEATURES += "qti-ab-boot qti-adsp qti-cdsp fastrpc qti-tzlog qti-crypto qti-security qseecompat qti-smciqseecomd qti-uvc qti-audio smcinvoke file-based-encryption qti-data-modem qti-location gptee ssgtzd ta_autoload qwesd qti-hdcp qti-supports-qce-mapping"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

DISTRO_FEATURES:remove = "qti-fastcv ros2 qirp-sdk qti-auto-framing-stabilization"
DISTRO_FEATURES:append = " qti-uvc virtualization seccomp"

QPERMISSIONS_ENABLE = "1"

# SELinux is set in enforcing mode, by default, as below;
# DEFAULT_ENFORCING ?= "enforcing"
# During bring up, to unblock the technology teams, SELinux is set to permissive.
##############################################################
DEFAULT_ENFORCING = "enforcing"

# pack for installation of ESDK
COREBASE_FILES:append = " meta-poky"
