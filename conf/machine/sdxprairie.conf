#@TYPE: Machine
#@NAME: SDXPRAIRIE
#@DESCRIPTION: Machine configuration for QTI sdxprairie

require conf/machine/include/sdxprairie.inc

KERNEL_IMAGETYPE = "zImage-dtb"
KERNEL_DTS_NAME = "sdxprairie"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x82000000"

KERNEL_CONFIG = "${@['sdxprairie-perf_defconfig', 'sdxprairie_defconfig'][d.getVar('VARIANT', True) == ('' or 'debug')]}"

KERNEL_CMD_PARAMS = "noinitrd ro rootwait console=ttyMSM0,115200,n8 androidboot.hardware=qcom msm_rtb.filter=0x237 androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 firmware_class.path=/lib/firmware/updates service_locator.enable=1 net.ifnames=0 atlantic_fwd.rx_ring_size=1024"
KERNEL_CMD_PARAMS_remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8 androidboot.console=ttyMSM0', '', d)}"

LLVM_VERSION = "6.0"

#Enable audio kernel
DISTRO_FEATURES += "audiodlkm audio-dlkm"

#Uncomment the below line to enable recovery upgrade for nand devices
#DISTRO_FEATURES += "nand-recovery-upgrade"

DISTRO_FEATURES_append += " selinux"
DISTRO_FEATURES_append += " cmnlib-preload"
#Uncomment the below line to enable OTA package verification feature
#DISTRO_FEATURES_append += " ota-package-verification"
DISTRO_FEATURES_FILTER_NATIVE += " selinux"
DEFAULT_ENFORCING = "enforcing"
MACHINE_MNT_POINTS = "/firmware /persist /cache"

# Enable early USB init
DISTRO_FEATURES_append = " early-usb-init"

# Whitelist packages having commercial license.
LICENSE_FLAGS_WHITELIST  += "commercial_ffmpeg"
