#@TYPE: Machine
#@NAME: msm8996

#@DESCRIPTION: Machine configuration for 8x96autodvrs kernel4.4

require conf/machine/include/auto-common.inc

MACHINE_FEATURES_BACKFILL_remove = "qemu-usermode"

# support early-ethernet feature
DISTRO_FEATURES_append += "early-ethernet"
MACHINE_EXTRA_RRECOMMENDS = " kernel-modules kernel-devicetree"

PREFERRED_PROVIDER_virtual/kernel = "linux-msm-4.4"

CONSOLE_DEVICE = "ttyMSM0"

KERNEL_IMAGETYPE ?= "Image"
KERNEL_DEVICETREE ?= "qcom/apq8096pro-auto-cdp.dtb qcom/apq8096pro-v1.1-auto-adp.dtb qcom/apq8096pro-v1.1-auto-adp-lite.dtb qcom/apq8096pro-v1.1-auto-cdp.dtb qcom/apq8096-v2-auto-dragonboard.dtb qcom/apq8096-v3-auto-adp.dtb qcom/apq8096-v3-auto-cdp.dtb qcom/apq8096-v3-auto-dragonboard.dtb qcom/msm8996pro-auto-adp.dtb qcom/msm8996pro-auto-adp-lite.dtb qcom/msm8996pro-auto-cdp.dtb qcom/msm8996pro-v1.1-auto-cdp.dtb qcom/msm8996-v3-auto-adp.dtb qcom/msm8996-v3-auto-cdp.dtb qcom/msm8996-v3-pm8004-agave-adp.dtb qcom/msm8996-v3-pm8004-agave-adp-lite.dtb qcom/msm8996-v3-pm8004-mmxf-adp.dtb"
KERNEL_DTS_NAME = "msm8996"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81900000"
KERNEL_CMD_PARAMS = "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 cma=16M@0-0xffffffff rootwait rootfstype=ext4 root=/dev/mmcblk0p18 fsck.repair=yes firmware_class.path=/firmware/image/ swiotlb=128 oops=panic"
KERNEL_PERF_CMD_PARAMS = "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 cma=16M@0-0xffffffff rootwait rootfstype=ext4 root=/dev/mmcblk0p18 fsck.repair=yes firmware_class.path=/firmware/image/ swiotlb=128 oops=panic"
RECOVERY_CMD_PARAMS = "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 cma=16M@0-0xffffffff rootfstype=ramfs root=/dev/ram0 rdinit=/sbin/init firmware_class_path=/firmware/image/off_disp_ser"
SERIAL_CONSOLE = "115200 ${CONSOLE_DEVICE}"

PACKAGECONFIG_append_pn-connman = " vpnc ipsecvici"
PACKAGECONFIG_append_pn-strongswan = " swanctl systemd-charon"

BBMASK_append = "|meta-qti-display/recipes-products/images/machine-qsap-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes-products/images/machine-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes-products/images/machine-minimal-image.bbappend"
BBMASK_append = "|meta-qti-display/recipes/drm/libdrm_%.bbappend"
BBMASK_append = "|meta-qti-display/recipes/wayland/wayland_1.9.0.bb"
BBMASK_append = "|meta-qti-display/recipes/wayland/weston-init.bbappend"
BBMASK_append = "|meta-qti-display/recipes/wayland/weston_1.9.0.bbappend"
BBMASK_append = "|meta-qti-bsp/recipes-display/display-hal/display-hal-linux_git.bb"
BBMASK_append = "|meta-qti-bsp/recipes-display/display-hal/display-hal_git.bb"
BBMASK_append = "|meta-qti-bsp/recipes-display/sdm/sdm.bb"
BBMASK_append = "|meta-qti-bsp/recipes-graphics/wayland/weston_%.bbappend"
