#@TYPE: Machine
#@NAME: SA515M-Dual-NAND-INITRAMFS
#@DESCRIPTION: Machine configuration for SA515M Initramfs

IMAGE_FSTYPES = "${INITRAMFS_FSTYPES}"

INITRAMFS_IMAGE = "qti-recovery-image"

BOOTIMAGE_TARGET = "${MACHINE}-recovery-boot.img"
BUNDLED_BOOTIMAGE_TARGET = "${MACHINE}-recovery-bundled-boot.img"

KERNEL_CMD_PARAMS_remove = "noinitrd"
KERNEL_CMD_PARAMS_append = " ramdisk_size=40960"

KERNEL_DTB_NAMES = "vendor/qcom/sa515m-v2-dsda-dual-nand-recovery-cdp.dtb"

DEFAULT_ENFORCING = "permissive"

## MACHINE_FEATURES ##
# dual-nand-recovery      Machine Support Dual NAND recovry support
MACHINE_FEATURES += "dual-nand-recovery"

KERNEL_IMAGENAME = "${@bb.utils.contains('MACHINE_FEATURES', 'dual-nand-recovery', '-nandrecovery', '', d)}"
