#@TYPE: Machine
#@NAME: msm8996

#@DESCRIPTION: Machine configuration for msm systems

require conf/machine/include/auto-common.inc

MACHINE_EXTRA_RRECOMMENDS = " kernel-modules kernel-devicetree"

PREFERRED_PROVIDER_virtual/kernel = "linux-msm-4.4"

CONSOLE_DEVICE = "ttyMSM0"

KERNEL_IMAGETYPE ?= "Image"

KERNEL_DEVICETREE ?= "qcom/msm8996pro-auto-fusion.dtb qcom/apq8096pro-auto-cdp.dtb qcom/apq8096pro-v1.1-auto-adp.dtb qcom/apq8096pro-v1.1-auto-adp-lite.dtb qcom/apq8096pro-v1.1-auto-cdp.dtb qcom/apq8096-v2-auto-dragonboard.dtb qcom/apq8096-v3-auto-adp.dtb qcom/apq8096-v3-auto-cdp.dtb qcom/apq8096-v3-auto-dragonboard.dtb qcom/msm8996pro-auto-adp.dtb qcom/msm8996pro-auto-adp-lite.dtb qcom/msm8996pro-auto-cdp.dtb qcom/msm8996pro-v1.1-auto-cdp.dtb qcom/msm8996-v3-auto-adp.dtb qcom/msm8996-v3-auto-cdp.dtb qcom/msm8996-v3-pm8004-agave-adp.dtb qcom/msm8996-v3-pm8004-agave-adp-lite.dtb qcom/msm8996-v3-pm8004-mmxf-adp.dtb"
KERNEL_DTS_NAME = "msm8996"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81900000"


PACKAGECONFIG_append_pn-connman = " vpnc ipsecvici"
PACKAGECONFIG_append_pn-strongswan = " swanctl systemd-charon"


KERNEL_CMD_PARAMS = "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 cma=16M@0-0xffffffff rootwait rootfstype=ext4 root=/dev/mmcblk0p18 oops=panic"
RECOVERY_CMD_PARAMS ?= "console=${CONSOLE_DEVICE},115200,n8 androidboot.console=${CONSOLE_DEVICE} androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 cma=16M@0-0xffffffff rootfstype=ramfs root=/dev/ram0 rdinit=/sbin/init"

SERIAL_CONSOLE = "115200 ${CONSOLE_DEVICE}"

