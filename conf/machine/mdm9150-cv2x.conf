#@TYPE: Machine
#@NAME: MDM9150-CV2X
#@DESCRIPTION: Machine configuration for MDM9150 CV2X

require ${COREBASE}/meta-qti-bsp/conf/machine/mdm9650.conf

# Change UBI commands for 2K NAND
PAGE_SIZE = '2048'
UBINIZE_ARGS = "-m 2048 -p 128KiB -s 2048"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 2047 -F"

MACHINE_FEATURES += "cv2x"
MACHINEOVERRIDES =. "cv2x:"

PREFERRED_VERSION_iproute2 = "4.4.0"

BBMASK .= "|meta-qti-audio|meta-qti-bt|meta-qti-wlan"
