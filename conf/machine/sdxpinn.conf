#@TYPE: Machine
#@NAME: SDXPINN
#@DESCRIPTION: Machine configuration for SDXPINN
BASEMACHINE ?= "sdxpinn"
require conf/machine/include/basemachine.inc

include conf/machine/include/arm/arch-armv8a.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-msm"
PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg-gki"
PREFERRED_PROVIDER_virtual/mkdtimg   = "mkdtimg-gki"
#PREFERRED_PROVIDER_virtual/dtc-native = "dtc-android-build-native"
PREFERRED_VERSION_linux-msm ?= "5.15"
PREFERRED_VERSION_linux-msm-headers ?= "5.15"
PREFERRED_VERSION_kernel-toolchain ?= "5.15"
PREFERRED_VERSION_dtc-android-build ?= "5.15"
PREFERRED_VERSION_mkbootimg-gki ?= "5.15"
PREFERRED_VERSION_mod-signing-keys ?= "5.15"
PREFERRED_VERSION:securemsmdlkm ?= "1.0"

#### KERNEL ####
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_VARIANT = ""
KERNEL_VARIANT_qti-distro-nogplv3-debug = "debug_"
KERNEL_VARIANT_qti-distro-nogplv3-perf = "perf_"
KERNEL_VARIANT_qti-distro-nogplv3-user = "user_"
INITRAMFS_IMAGE = "qti-ramdisk-image"
INITRAMFS_FSTYPES = "cpio.lz4"
VENDOR_INITRAMFS_IMAGE = "qti-vendor-ramdisk-image"
KERNEL_DEFCONFIG = "msm-kernel-sdxpinn-cpe-wkk-${KERNEL_VARIANT}defconfig"
KERNEL_CONFIG = "build.config.msm.sdxpinn-cpe-wkk"

#Various kernel directories
KERNEL_PLATFORM_PATH = "${WORKSPACE}/kernel-5.15/kernel_platform"
KERNEL_PREBUILT_PATH = "${WORKSPACE}/kernel-5.15/out/${KERNEL_DEFCONFIG}"
KERNEL_PREBUILT_DISTDIR = "${WORKSPACE}/kernel-5.15/out/${KERNEL_DEFCONFIG}/dist"
KERNEL_BUILD_CONFIG = "msm-kernel/${KERNEL_CONFIG}"
KERNEL_OUT_PATH = "${KERNEL_PREBUILT_PATH}"

#### dtb ####
KERNEL_DTB_NAMES   = " \
        vendor/qcom/sdxpinn-idp-cpe.dtb \
        vendor/qcom/sdxpinn-idp-cpe-v2.dtb \
        vendor/qcom/sdxpinn-idp-mbb.dtb \
        vendor/qcom/sdxpinn-idp-mbb-v2.dtb \
"
MACHINE_SUPPORTS_DTBO = "0"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "False"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### cmdline ####
# use no gpl V3
CONSOLE_PARAM:qti-distro-perf  = "console=ttyMSM0,115200n8"
CONSOLE_PARAM:qti-distro-debug = "ro rootwait console=ttyMSM0,115200,n8 androidboot.hardware=qcom msm_rtb.filter=0x237 androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 firmware_class.path=/lib/firmware/updates service_locator.enable=1 net.ifnames=0 atlantic_fwd.rx_ring_size=512 atlantic_fwd.rx_linear=1 pcie_ports=compat pci=pcie_bus_perf"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM}"

#### systemd ####
SERIAL_CONSOLES ?= "115200;ttyMSM0"

#### others ####
PAGE_SIZE ?= '4096'

#Abl would be enabled later
EXTRA_IMAGEDEPENDS += "edk2"
PREFERRED_VERSION:edk2 ?= "4.0"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

#QSEEComCompat and QSEECom are mutually exlusive and QSEEComCompat depends on  smcinvoke
#lv-build builds the required listernes , le_qseecom enables qseecomd
# qti-location:           Machine supports Location solution
MACHINE_FEATURES += "dm-verity-none emmc_boot nand_boot qti-recovery qti-location qwesd"

##############################################################

# SElinux enablement in enforcing mode

#############################################################

# DEFAULT_ENFORCING = "permissive"
MACHINE_MNT_POINTS = " \
        /persist \
        /cache \
        /data \
        /nvram \
        /rdklogs \
        /firmware \
        /systemrw \
"

PAGE_SIZE ?= '4096'
UBINIZE_ARGS ?= "-m 4096 -p 256KiB -s 4096"
MKUBIFS_ARGS ?= "-m 4096 -e 253952 -c 2146 -F"
# Sysfs ubi volume sizes
SYSTEM_VOLUME_SIZE ?= "110MiB"
# rootfs volume size for 1GB storage
SYSTEM_VOLUME_SIZE_G ?= "214MiB"
CACHE_VOLUME_SIZE ?= "15MiB"
SYSTEMRW_VOLUME_SIZE ?= "6MiB"
PERSIST_VOLUME_SIZE ?= "6MiB"
SYSTEM_SIZE_EXT4   ?= "268435456"
NVRAM_SIZE_EXT4   ?= "52428800"
# USERDATA_SIZE ?= "200GiB"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4 ubi"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "False"
# Subsystem Ramdump support
MACHINE_SUPPORTS_SSR = "True"

MACHINE_FSCONFIG_CONF = "sdxpinn-fsconfig.conf"

USBCOMPOSITION = "4EE7"

MACHINE_SUPPORTS_INIT_RAMDISK = "False"
MACHINE_SUPPORTS_ADB_OVER_PCIE = "True"
MACHINE_SUPPORTS_DIAG_OVER_PCIE = "True"

# Partition conf
MACHINE_PARTITION_CONF = "sdxpinn-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF_EMMC = "sdxpinn-filesmap"
MACHINE_FILESMAP_CONF = "sdxpinn-filesmap"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

### MACHINE_FEATURES ###
DISTRO_FEATURES:remove = "selinux"

GENERATE_AB_OTA_PACKAGE = "0"

