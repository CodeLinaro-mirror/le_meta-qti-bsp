# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-clang"
BBFILE_PATTERN_qti-clang = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-clang = "15"

LAYERSERIES_COMPAT_qti-clang = "dunfell  gatesgarth hardknott"
