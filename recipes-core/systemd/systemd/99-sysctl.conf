# Increase Linux auto tuning TCP buffer limits
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.core.rmem_default=1048576
net.core.wmem_default=1048576

# Increase TCP max buffer size
net.ipv4.tcp_rmem=4096 87380 1048576
net.ipv4.tcp_wmem=4096 65536 1048576
net.ipv4.tcp_mem=1048576 1048576 1048576

#Increase Linux IP fragmentation memory limits
net.ipv4.ipfrag_high_thresh=33554432
net.ipv4.ipfrag_low_thresh=31457280

#Disable IP ID mitigations
net.ipv4.ipfrag_max_dist=0

# General kernel configurations
kernel.panic_on_oops=1
kernel.randomize_va_space=2
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
