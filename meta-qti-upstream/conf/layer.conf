# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qti-upstream"
BBFILE_PATTERN_qti-upstream = "^${LAYERDIR}/"
BBFILE_PRIORITY_qti-upstream = "9"

LAYERSERIES_COMPAT_qti-upstream = "dunfell  gatesgarth hardknott kirkstone"
