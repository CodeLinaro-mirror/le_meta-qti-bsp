require conf/distro/auto.conf

DISTRO_FEATURES:append = " qti-lxc qti-avb qti-avb-lxc"
DISTRO_FEATURES:remove:lemans = " qti-lxc"

DISTRO_FEATURES:append:sa81x5 = " selinux"
DISTRO_FEATURES_NATIVE:append:sa81x5 = " selinux"

PRODUCT = "${MACHINE}lxc"

# Targets with selinux enabled should use libseilnux in meta-selinux, others stay the way it was.
BBMASK:sa81x5 += "meta-qti-bsp/meta-qti-base/recipes-aosp/libselinux/libselinux_git.bb"
BBMASK:sa81x5 += "meta-qti-bsp/meta-qti-base/recipes-safelinux-dbg-modules/safelinux-dbg-modules/safelinux-dbg-modules_git.bb"
BBMASK:sa81x5 += "meta-selinux/recipes-devtools/e2fsprogs/e2fsprogs_%.bbappend"

# Prefer refpolicy
#refpolicy-qti corresponds to combined SELinux policy for LXC
PREFERRED_PROVIDER_virtual/refpolicy = "refpolicy-qti"

DEFAULT_ENFORCING = "enforcing"
#DEFAULT_ENFORCING = "permissive"
