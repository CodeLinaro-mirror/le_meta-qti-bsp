require conf/distro/include/auto-common.inc

DISTRO_NAME = "auto"

DISTRO_FEATURES:append:sa81x5 = "${@bb.utils.contains_any('VARIANT', 'perf user', ' early_init', '', d)}"

DISTRO_FEATURES:append = " \
    qti-adsp \
    qti-audio \
    qti-bluetooth \
    qti-fastcv \
    qti-audio-ar \
    qti-camera \
    qti-cdsp \
    qti-core \
    qti-data \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-tools \
    qti-vnw \
    qti-location \
    ab-boot-support \
"

DISTRO_FEATURES:remove = "\
    qti-location \
    early-eth \
    ipa3 \
"

DISTRO_FEATURES:monaco:remove = "\
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-fastcv \
    qti-audio \
    qti-bluetooth \
    qti-fastcv \
    qti-audio-ar \
    qti-camera \
    qti-display \
    qti-graphics \
    qti-vnw \
    ab-boot-support \
    qti-extra \
    qti-avb \
"

# Disable qti-avb on minimal as the feature not need
DISTRO_FEATURES:remove:pn-core-image-minimal = "qti-avb"
DISTRO_FEATURES:remove:sa8775 = "qti-avb"
