# rsyslog v3: load input modules
# If you do not load inputs, nothing happens!
# You may need to set the module load path if modules are not found.
#
# Ported from debian's sysklogd.conf

module(load="imuxsock"   
       SysSock.Use="on"
       SysSock.Name="/dev/log")
$ModLoad imklog   # kernel logging (formerly provided by rklogd)

template(name="FileFormat" type="list") {
    property(name="timestamp" dateFormat="rfc3339")
    constant(value=" ")
    property(name="pri-text")
    constant(value=" ")
    property(name="syslogtag")
    property(name="msg" spifno1stsp="on" )
    property(name="msg" droplastlf="on" )
    constant(value="\n")
    }

#
# Use traditional timestamp format.
# To enable high precision timestamps, comment out the following line.
#
$ActionFileDefaultTemplate FileFormat

# Filter duplicated messages
#$RepeatedMsgReduction on

#
# Set the default permissions for all log files.
#
$FileOwner root
$FileGroup root
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser root
$PrivDropToGroup root

$MaxMessageSize 64k


$outchannel log_rotation_auth,          /var/volatile/log/auth.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/auth.log
$outchannel log_rotation_syslog,        /var/volatile/log/syslog,       1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/syslog
$outchannel log_rotation_cron,          /var/volatile/log/cron.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/cron.log
$outchannel log_rotation_daemon,        /var/volatile/log/daemon.log,   1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/daemon.log
$outchannel log_rotation_kern,          /var/volatile/log/kern.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/kern.log
$outchannel log_rotation_lpr,           /var/volatile/log/lpr.log,      1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/lpr.log
$outchannel log_rotation_mail_all,      /var/volatile/log/mail.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/mail.log
$outchannel log_rotation_user,          /var/volatile/log/user.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/user.log
$outchannel log_rotation_mail_info,     /var/volatile/log/mail.info,    1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/mail.info
$outchannel log_rotation_mail_warn,     /var/volatile/log/mail.warn,    1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/mail.warn
$outchannel log_rotation_mail_err,      /var/volatile/log/mail.err,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/mail.err
$outchannel log_rotation_news_crit,     /var/volatile/log/news.crit,    1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/news.crit
$outchannel log_rotation_news_err,      /var/volatile/log/news.err,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/news.err
$outchannel log_rotation_news_notice,   /var/volatile/log/news.notice,  1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/news.notice
$outchannel log_rotation_debug,         /var/volatile/log/debug,        1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/debug
$outchannel log_rotation_messages,      /var/volatile/log/messages,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/messages
$outchannel log_rotation_boot,          /var/volatile/log/boot.log,     1048576,    /etc/rsyslog.d/rsyslog_rotate.sh /var/volatile/log/boot.log

#  Default rules for rsyslog.
#
#                       For more information see rsyslog.conf(5) and /etc/rsyslog.conf

#
# First some standard log files.  Log by facility.
#
auth,authpriv.*                 :omfile:$log_rotation_auth
*.*;auth,authpriv.none          :omfile:$log_rotation_syslog
cron.*                          :omfile:$log_rotation_cron
daemon.*                        :omfile:$log_rotation_daemon
kern.*                          :omfile:$log_rotation_kern
lpr.*                           :omfile:$log_rotation_lpr
mail.*                          :omfile:$log_rotation_mail_all
user.*                          :omfile:$log_rotation_user

#
# Logging for the mail system.  Split it up so that
# it is easy to write scripts to parse these files.
#
mail.info                       :omfile:$log_rotation_mail_info
mail.warn                       :omfile:$log_rotation_mail_warn
mail.err                        :omfile:$log_rotation_mail_err

# Logging for INN news system
#
news.crit                       :omfile:$log_rotation_news_crit
news.err                        :omfile:$log_rotation_news_err
news.notice                     :omfile:$log_rotation_news_notice

#
# Some "catch-all" log files.
#
*.=debug;\
        auth,authpriv.none;\
        news.none;mail.none     :omfile:$log_rotation_debug
*.=info;*.=notice;*.=warn;\
        auth,authpriv.none;\
        cron,daemon.none;\
        mail,news.none          :omfile:$log_rotation_messages

#
# Emergencies are sent to everybody logged in.
#
*.emerg                         :omusrmsg:*

# Save boot messages also to boot.log
local7.*                        :omfile:$log_rotation_boot

# Remote Logging (we use TCP for reliable delivery)
# An on-disk queue is created for this action. If the remote host is
# down, messages are spooled to disk and sent when it is up again.
#$WorkDirectory /var/spool/rsyslog # where to place spool files
#$ActionQueueFileName uniqName # unique name prefix for spool files
$ActionQueueMaxDiskSpace 10m   # 1gb space limit (use as much as possible)
#$ActionQueueSaveOnShutdown on # save messages to disk on shutdown
#$ActionQueueType LinkedList   # run asynchronously
#$ActionResumeRetryCount -1    # infinite retries if host is down
# remote host is: name/ip:port, e.g. 192.168.0.1:514, port optional
#*.* @@remote-host:514


